<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | Sakura Sushi</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="site-header"><a class="logo" href="index.html"><span>桜</span> Sakura Sushi</a><button class="menu-toggle">☰</button><nav class="nav"><a href="index.html">Home</a><a href="menu.html">Menu</a><a href="about.html">About</a><a href="contact.html">Contact</a><a class="cart-link" href="cart.html">Cart <b id="cartCount">0</b></a></nav></header>
<main><section class="page-hero compact"><p class="eyebrow">CHECKOUT</p><h1>Almost <em>there.</em></h1></section><section class="section checkout-layout"><form id="checkoutForm" class="form-card"><h2>Delivery details</h2><div class="form-row"><label>Full Name<input name="name" required placeholder="Your full name"></label><label>Phone Number<input name="phone" required pattern="[6-9][0-9]{9}" inputmode="numeric" placeholder="10-digit number"></label></div><label>Email<input type="email" name="email" required placeholder="you@example.com"></label><label>Delivery Address<textarea name="address" required rows="3" placeholder="House no., street, area"></textarea></label><div class="form-row"><label>City<input name="city" required value="Ludhiana"></label><label>Pincode<input name="pincode" required pattern="[0-9]{6}" inputmode="numeric" placeholder="6 digits"></label></div><fieldset><legend>Payment</legend><label class="radio"><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label><label class="radio"><input type="radio" name="payment" value="Demo Online Payment"> Demo Online Payment</label></fieldset><button class="btn primary full" type="submit">Place Order</button><div id="checkoutMessage" class="form-message"></div></form><aside class="summary" id="checkoutSummary"></aside></section></main>
<footer class="footer"><div><a class="logo" href="index.html"><span>桜</span> Sakura Sushi</a><p>Fresh Sushi. Authentic Taste.</p></div><div><h4>Quick Links</h4><a href="menu.html">Menu</a><a href="contact.html">Contact</a></div><div class="copyright">© 2026 Sakura Sushi. College Project.</div></footer><script src="js/script.js"></script></body></html>
